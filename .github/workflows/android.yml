      - name: Configure native Android build
        working-directory: phonexr-src
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("app/src/main/cpp/phonexr_compat.cpp"),
              Path("app/src/main/cpp/phonexr_compositor.cpp"),
          ]

          vulkan_header = """#ifndef VK_USE_PLATFORM_ANDROID_KHR
          #define VK_USE_PLATFORM_ANDROID_KHR
          #endif
          #include <vulkan/vulkan.h>
          #include <vulkan/vulkan_android.h>

          """

          for p in files:
              if not p.exists():
                  raise SystemExit(f"Dosya bulunamadı: {p}")

              s = p.read_text()

              if "#include <vulkan/vulkan.h>" not in s:
                  s = vulkan_header + s

              p.write_text(s)

              print(f"Vulkan headers added: {p}")
          PY

          echo "Patched Vulkan sources:"
          head -15 app/src/main/cpp/phonexr_compat.cpp
          echo
          head -15 app/src/main/cpp/phonexr_compositor.cpp
