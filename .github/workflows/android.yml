name: PhoneXR Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract PhoneXR source
        run: |
          rm -rf phonexr-src
          mkdir -p phonexr-src
          unzip -o qualyx-phonexr-v10-build.zip -d phonexr-src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Patch OpenXR runtime compatibility
        working-directory: phonexr-src
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/cpp/phonexr_runtime.cpp")

          if not p.exists():
              raise SystemExit(f"Dosya bulunamadı: {p}")

          s = p.read_text(encoding="utf-8")

          lines = s.splitlines(keepends=True)
          kept = []

          for line in lines:
              if re.search(r'\bPFN_xr[A-Za-z0-9_]+\b', line):
                  continue

              if re.search(r'^\s*MAP\(xr[A-Za-z0-9_]+\)\s*;?\s*$', line):
                  continue

              kept.append(line)

          s = "".join(kept)

          s = re.sub(
              r'v\[k\]\.type\s*=\s*7\s*;\s*v\[k\]\.next\s*=\s*nullptr\s*;?',
              '',
              s
          )

          p.write_text(s, encoding="utf-8")

          print("OpenXR runtime compatibility patch uygulandı.")
          PY

      - name: Patch Vulkan headers
        working-directory: phonexr-src
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("app/src/main/cpp/phonexr_compat.cpp"),
              Path("app/src/main/cpp/phonexr_compositor.cpp"),
          ]

          header = """#ifndef VK_USE_PLATFORM_ANDROID_KHR
          #define VK_USE_PLATFORM_ANDROID_KHR
          #endif
          #include <vulkan/vulkan.h>
          #include <vulkan/vulkan_android.h>

          """

          for p in files:
              if not p.exists():
                  raise SystemExit(f"Dosya bulunamadı: {p}")

              s = p.read_text(encoding="utf-8")

              if "#include <vulkan/vulkan.h>" not in s:
                  p.write_text(header + s, encoding="utf-8")

              print(f"Vulkan header kontrol edildi: {p}")
          PY

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check extracted project
        working-directory: phonexr-src
        run: |
          echo "=== Project files ==="
          find . -maxdepth 3 -type f | sort

          echo
          echo "=== Gradle files ==="
          find . -name "build.gradle*" -o -name "settings.gradle*"

          echo
          echo "=== CMake files ==="
          find . -name "CMakeLists.txt"

          echo
          echo "=== Native source files ==="
          find app/src/main/cpp -maxdepth 1 -type f | sort

      - name: Build APK
        working-directory: phonexr-src
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qualyx-phonexr-debug-arm64
          path: phonexr-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
