name: PhoneXR Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract PhoneXR source
        run: |
          rm -rf phonexr-src
          mkdir -p phonexr-src
          unzip -o qualyx-phonexr-v10-build.zip -d phonexr-src
          echo "Extracted:"
          find phonexr-src -maxdepth 3 -type f | head -100

      - name: Fix OpenXR function pointers
        working-directory: phonexr-src
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          files = list(Path(".").rglob("phonexr_runtime.cpp"))
          if not files:
              raise SystemExit("phonexr_runtime.cpp bulunamadı")

          p = files[0]
          s = p.read_text(encoding="utf-8")

          funcs = []
          for name in re.findall(r'\bMAP\((xr[A-Za-z0-9_]+)\)', s):
              if name not in funcs:
                  funcs.append(name)

          missing = []
          for name in funcs:
              if not re.search(
                  r'\bPFN_' + re.escape(name) + r'\s+' + re.escape(name) + r'\b',
                  s
              ):
                  missing.append(name)

          if missing:
              decls = "\n".join(
                  f"PFN_{name} {name} = nullptr;"
                  for name in missing
              )

              first_map = re.search(r'(?m)^.*\bMAP\(', s)
              if not first_map:
                  raise SystemExit("MAP(...) çağrısı bulunamadı")

              pos = first_map.start()
              s = s[:pos] + decls + "\n\n" + s[pos:]
              p.write_text(s, encoding="utf-8")

          print("OpenXR MAP fonksiyonları:", len(funcs))
          print(
              "Eklenen pointer tanımları:",
              ", ".join(missing) if missing else "yok"
          )
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check extracted project
        working-directory: phonexr-src
        run: |
          echo "Project:"
          find . -maxdepth 3 -type f | sort
          echo
          echo "Gradle files:"
          find . -name "build.gradle*" -o -name "settings.gradle*"

      - name: Build APK
        working-directory: phonexr-src
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qualyx-phonexr-debug-arm64
          path: phonexr-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
