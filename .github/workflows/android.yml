      - name: Patch OpenXR runtime compatibility
        working-directory: phonexr-src
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/cpp/phonexr_runtime.cpp")

          if not p.exists():
              raise SystemExit(f"Dosya bulunamadı: {p}")

          s = p.read_text(encoding="utf-8")

          # Remove the complete OpenXR loader-dispatch block.
          # The bundled runtime implements these functions itself.
          pattern = re.compile(
              r'(?ms)^[ \t]*PFN_xrCreateInstance\b.*?'
              r'^[ \t]*MAP\(xrGetCurrentInteractionProfile\).*?\n'
              r'^[ \t]*\}'
          )

          s2, count = pattern.subn("", s)

          if count == 0:
              print("PFN/MAP bloğu bulunamadı; alternatif temizleme uygulanıyor.")

              lines = s.splitlines(keepends=True)

              start = None
              end = None

              for i, line in enumerate(lines):
                  if "PFN_xrCreateInstance" in line:
                      start = i
                  if start is not None and "MAP(xrGetCurrentInteractionProfile)" in line:
                      end = i
                      break

              if start is not None and end is not None:
                  # Include the following closing brace.
                  if end + 1 < len(lines) and lines[end + 1].strip() == "}":
                      end += 1

                  del lines[start:end + 1]
                  s2 = "".join(lines)
                  count = 1

          # XrView in this bundled source has no type/next members.
          s2 = re.sub(
              r'v\[k\]\.type\s*=\s*7\s*;\s*v\[k\]\.next\s*=\s*nullptr\s*;?',
              '',
              s2
          )

          p.write_text(s2, encoding="utf-8")

          print(f"OpenXR dispatch bloğu kaldırıldı: {count}")
          print("XrView type/next erişimi düzeltildi.")
          PY
