name: PhoneXR Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract PhoneXR source
        run: |
          rm -rf phonexr-src
          mkdir -p phonexr-src
          unzip -o qualyx-phonexr-v10-build.zip -d phonexr-src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

            - name: Patch OpenXR runtime
        working-directory: phonexr-src
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/cpp/phonexr_runtime.cpp")

          if not p.exists():
              raise SystemExit(f"Dosya bulunamadı: {p}")

          s = p.read_text(encoding="utf-8")

          # Remove PFN declarations.
          s = re.sub(
              r'^[ \t]*PFN_xr[A-Za-z0-9_]+[ \t]+xr[A-Za-z0-9_]+[ \t]*=[ \t]*nullptr[ \t]*;[ \t]*\n?',
              '',
              s,
              flags=re.MULTILINE
          )

          # Remove every standalone MAP(xrFunction) line.
          s = re.sub(
              r'^[ \t]*MAP\(xr[A-Za-z0-9_]+\)[ \t]*;?[ \t]*\n?',
              '',
              s,
              flags=re.MULTILINE
          )

          # Remove the old MAP macro definition if present.
          s = re.sub(
              r'(?ms)^[ \t]*#define[ \t]+MAP\(.*?\n(?:.*?\n)*?[ \t]*#undef[ \t]+MAP.*?\n?',
              '',
              s
          )

          # Remove the invalid XrView fields.
          s = re.sub(
              r'v\[k\]\.type\s*=\s*7\s*;\s*',
              '',
              s
          )

          s = re.sub(
              r'v\[k\]\.next\s*=\s*nullptr\s*;\s*',
              '',
              s
          )

          p.write_text(s, encoding="utf-8")

          print("OpenXR PFN/MAP temizliği tamamlandı.")
          print("XrView type/next temizliği tamamlandı.")
          PY      - name: Patch OpenXR runtime
        working-directory: phonexr-src
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/cpp/phonexr_runtime.cpp")

          if not p.exists():
              raise SystemExit(f"Dosya bulunamadı: {p}")

