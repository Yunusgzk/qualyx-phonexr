              '',
              s,
              flags=re.MULTILINE
          )

          # Remove every standalone MAP(xrFunction) line.
          s = re.sub(
              r'^[ \t]*MAP\(xr[A-Za-z0-9_]+\)[ \t]*;?[ \t]*\n?',
              '',
              s,
              flags=re.MULTILINE
          )

          # Remove the old MAP macro definition if present.
          s = re.sub(
              r'(?ms)^[ \t]*#define[ \t]+MAP\(.*?\n(?:.*?\n)*?[ \t]*#undef[ \t]+MAP.*?\n?',
              '',
              s
          )

          # Remove the invalid XrView fields.
          s = re.sub(
              r'v\[k\]\.type\s*=\s*7\s*;\s*',
              '',
              s
          )

          s = re.sub(
              r'v\[k\]\.next\s*=\s*nullptr\s*;\s*',
