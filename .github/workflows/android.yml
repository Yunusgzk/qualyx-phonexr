      - name: Configure native Android build
        working-directory: phonexr-src
        run: |
          echo "Searching CMakeLists.txt..."

          CMAKE_FILE="./CMakeLists.txt"

          if [ ! -f "$CMAKE_FILE" ]; then
            echo "CMakeLists.txt bulunamadı"
            find . -name "CMakeLists.txt" -print
            exit 1
          fi

          echo "Using: $CMAKE_FILE"

          sed -i '1i add_compile_definitions(VK_USE_PLATFORM_ANDROID_KHR)' "$CMAKE_FILE"

          echo "Updated CMakeLists:"
          head -20 "$CMAKE_FILE"
